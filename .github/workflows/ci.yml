name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # La misma que en producción (el mini-PC): el CI tiene que probar lo que corre.
          node-version: 20
      # Sin `npm ci`: no hay dependencias.
      - run: npm test
